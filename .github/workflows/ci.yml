name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libhts-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMAKE_MAIN=ON \
            -DMAKE_TEST=ON \
            -DMAKE_DAUGHTER=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ./build/test-expos
